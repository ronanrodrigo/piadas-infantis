<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff8e9" />
    <meta name="description" content="Uma piada infantil por vez." />
    <title>Rir & Brincar</title>
    <link rel="stylesheet" href="styles.css?v=2" />
    <script src="jokes.js?v=2" defer></script>
    <script src="app.js?v=2" defer></script>
  </head>
  <body>
    <main class="joke-card" aria-labelledby="joke-heading">
      <div id="joke-loading" class="loading-state" role="status">😄</div>
      <div id="joke-content" hidden>
        <h1 id="joke-heading" class="question"></h1>
        <div id="answer-box" class="answer-box" hidden>
          <p id="joke-answer" class="answer"></p>
        </div>
      </div>
      <div class="actions">
        <button id="reveal-button" class="button button-primary" type="button" hidden>Mostrar continuação</button>
        <button id="new-joke-button" class="button button-secondary" type="button" hidden>Próxima</button>
      </div>
    </main>
  </body>
</html>
